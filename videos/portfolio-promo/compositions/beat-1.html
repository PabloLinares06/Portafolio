<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 60px;
          color: #ffffff;
          font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
          overflow: hidden;
          perspective: 1200px;
          transform-style: preserve-3d;
        }
        .b1-stage {
          width: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          position: relative;
          transform-style: preserve-3d;
        }
        .b1-ambient-orb {
          position: absolute;
          width: 650px;
          height: 650px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(99, 102, 241, 0.45) 0%, rgba(16, 185, 129, 0.25) 50%, transparent 70%);
          filter: blur(80px);
          pointer-events: none;
          z-index: 0;
          opacity: 0;
        }
        .glass-pill {
          display: inline-flex;
          align-items: center;
          gap: 14px;
          padding: 16px 36px;
          border-radius: 9999px;
          background: rgba(14, 18, 28, 0.88);
          border: 1px solid rgba(255, 255, 255, 0.22);
          backdrop-filter: blur(28px);
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(99, 102, 241, 0.25);
          opacity: 0;
          z-index: 10;
        }
        .status-dot {
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: #10b981;
          box-shadow: 0 0 16px #10b981, 0 0 30px #10b981;
        }
        .pill-text {
          font-family: 'JetBrains Mono', monospace;
          font-size: 24px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #ffffff;
        }
        .b1-headline {
          margin-top: 48px;
          font-size: 92px;
          font-weight: 900;
          letter-spacing: -0.04em;
          line-height: 1.0;
          text-transform: uppercase;
          max-width: 1000px;
          z-index: 10;
          position: relative;
        }
        .b1-char {
          display: inline-block;
          opacity: 0;
          color: #ffffff;
          text-shadow: 0 10px 35px rgba(0, 0, 0, 0.9);
          transform-style: preserve-3d;
        }
        .chrome-sheen {
          position: absolute;
          inset: 0;
          background: linear-gradient(105deg, transparent 20%, rgba(255, 255, 255, 0.85) 50%, transparent 80%);
          mix-blend-mode: overlay;
          pointer-events: none;
          opacity: 0;
          z-index: 15;
        }
        .b1-role-container {
          margin-top: 44px;
          padding: 18px 44px;
          border-radius: 9999px;
          background: rgba(14, 18, 30, 0.92);
          border: 1px solid rgba(99, 102, 241, 0.55);
          box-shadow: 0 0 45px rgba(99, 102, 241, 0.35);
          opacity: 0;
          z-index: 10;
        }
        .b1-role-text {
          font-family: 'JetBrains Mono', monospace;
          font-size: 26px;
          font-weight: 700;
          letter-spacing: 0.08em;
          color: #c7d2fe;
        }
        .b1-tagline {
          margin-top: 44px;
          max-width: 920px;
          font-size: 38px;
          font-weight: 600;
          line-height: 1.35;
          color: #e2e8f0;
          opacity: 0;
          z-index: 10;
        }
        .flash-overlay {
          position: absolute;
          inset: 0;
          background: radial-gradient(circle at center, #ffffff 0%, rgba(99, 102, 241, 0.6) 40%, transparent 80%);
          pointer-events: none;
          opacity: 0;
          z-index: 100;
        }
      </style>

      <div id="root" data-composition-id="beat-1" data-duration="2.8" data-width="1080" data-height="1920">
        <div id="b1-stage" class="b1-stage">
          <div id="b1-orb" class="b1-ambient-orb"></div>
          <div id="b1-flash" class="flash-overlay"></div>

          <div id="b1-tag" class="glass-pill">
            <span class="status-dot"></span>
            <span class="pill-text">AVAILABLE FOR 2026</span>
          </div>

          <h1 id="b1-name" class="b1-headline">
            <div id="b1-sheen" class="chrome-sheen"></div>
            <span class="b1-char">J</span><span class="b1-char">U</span><span class="b1-char">A</span><span class="b1-char">N</span>
            <span class="b1-char">&nbsp;</span>
            <span class="b1-char">P</span><span class="b1-char">A</span><span class="b1-char">B</span><span class="b1-char">L</span><span class="b1-char">O</span>
            <br />
            <span class="b1-char">L</span><span class="b1-char">I</span><span class="b1-char">N</span><span class="b1-char">A</span><span class="b1-char">R</span><span class="b1-char">E</span><span class="b1-char">S</span>
          </h1>

          <div id="b1-role" class="b1-role-container">
            <span class="b1-role-text">FULL STACK & CREATIVE ENGINEER</span>
          </div>

          <p id="b1-desc" class="b1-tagline">
            Architecting High-Performance Systems & Interfaces
          </p>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // 1. Explosive ambient light expansion
        tl.fromTo(
          "#b1-orb",
          { opacity: 0, scale: 0.2 },
          { opacity: 0.9, scale: 1.5, duration: 1.2, ease: "expo.out" },
          0.0
        );

        // 2. Tag slams down with violent spring bounce
        tl.fromTo(
          "#b1-tag",
          { opacity: 0, y: -90, scale: 0.7 },
          { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(2.2)" },
          0.15
        );

        // 3. Name character explosion in 3D
        tl.fromTo(
          ".b1-char",
          { opacity: 0, y: 70, rotateX: 65, z: -100 },
          {
            opacity: 1,
            y: 0,
            rotateX: 0,
            z: 0,
            duration: 0.75,
            stagger: 0.03,
            ease: "expo.out",
          },
          0.28
        );

        // Chrome metallic sheen sweep across letters
        tl.fromTo(
          "#b1-sheen",
          { opacity: 0, x: -600 },
          { opacity: 0.8, x: 600, duration: 0.85, ease: "power2.inOut" },
          0.9
        );

        // 4. Role container with 3D pop
        tl.fromTo(
          "#b1-role",
          { opacity: 0, scale: 0.6, y: 35, rotateY: 15 },
          { opacity: 1, scale: 1, y: 0, rotateY: 0, duration: 0.65, ease: "back.out(1.9)" },
          0.95
        );

        // 5. Tagline reveal
        tl.fromTo(
          "#b1-desc",
          { opacity: 0, y: 40 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          1.3
        );

        // Continuous camera float / slow drift
        tl.to(
          "#b1-stage",
          { y: -20, rotateX: 4, duration: 2.2, ease: "sine.inOut" },
          0.5
        );

        // 6. Flash and hyper-zoom through into Scene 2
        tl.to(
          "#b1-flash",
          { opacity: 1, duration: 0.22, ease: "power2.in" },
          2.45
        );
        tl.to(
          "#b1-stage",
          { scale: 3.8, z: 600, opacity: 0, filter: "blur(14px)", duration: 0.38, ease: "expo.in" },
          2.42
        );

        window.__timelines["beat-1"] = tl;
        tl.seek(0);
      </script>
    </template>
  </body>
</html>
